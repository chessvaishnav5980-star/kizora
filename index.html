<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#15141f" />
<title>Kizuna</title>
<meta name="description" content="Kizuna — a cozy corner for you and your people." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A7%3C/text%3E%3C/svg%3E" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg-deepest: #15141f;
  --bg-sidebar: #1b1a27;
  --bg-chat: #201f2e;
  --bg-elevated: #2a2839;
  --bg-hover: #302e40;
  --border-subtle: #34314a;
  --text-primary: #f3f1f9;
  --text-secondary: #b4afc7;
  --text-muted: #736d8a;
  --accent: #e8a33d;
  --accent-hover: #f2b458;
  --accent-soft: rgba(232, 163, 61, 0.16);
  --violet: #9c87f5;
  --online: #43d67d;
  --danger: #f2555a;
  --danger-soft: rgba(242, 85, 90, 0.15);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font-family: var(--font-body); background: var(--bg-deepest); }
#root { display: flex; flex-direction: column; }

[data-theme="light"] {
  --bg-deepest: #f3f2f9;
  --bg-sidebar: #ffffff;
  --bg-chat: #fbfaff;
  --bg-elevated: #ffffff;
  --bg-hover: #eeecf8;
  --border-subtle: #e2e0ee;
  --text-primary: #1c1b26;
  --text-secondary: #4c4960;
  --text-muted: #8b87a0;
  --danger-soft: rgba(242, 85, 90, 0.12);
}
[data-theme="light"] .avatar-wrap .status-dot { border-color: var(--bg-sidebar); }
[data-theme="light"] .btn-google { border-color: var(--border-subtle); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
[data-theme="light"] .modal-overlay { background: rgba(30, 27, 50, 0.35); }
[data-theme="light"] .auth-card, [data-theme="light"] .modal { box-shadow: 0 16px 40px rgba(30,20,60,0.12); }

.app, .auth-shell, .loading-screen { font-family: var(--font-body); color: var(--text-primary); height: 100vh; width: 100%; background: var(--bg-deepest); }
.app { display: flex; overflow: hidden; }
* { scrollbar-width: thin; scrollbar-color: var(--border-subtle) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 8px; }
*::-webkit-scrollbar-track { background: transparent; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes messageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
@keyframes logoPulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(20px, -20px) scale(1.08); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes errorIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes modalIn { from { opacity: 0; transform: scale(0.92) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.view-fade-in { animation: fadeIn 0.3s ease both; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ---------- Server rail ---------- */
.server-rail { width: 72px; flex-shrink: 0; background: var(--bg-deepest); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; border-right: 1px solid var(--border-subtle); }
.rail-scroll { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; width: 100%; align-items: center; padding-bottom: 8px; }
.server-icon { position: relative; width: 48px; height: 48px; border-radius: 16px; background: var(--bg-elevated); border: none; color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: border-radius 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.15s ease; flex-shrink: 0; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
.server-icon:hover { border-radius: 14px; background: var(--accent); color: #1a1508; transform: scale(1.08); }
.server-icon:active { transform: scale(0.94); }
.server-icon.active { border-radius: 14px; background: var(--accent); color: #1a1508; }
.rail-pill { position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 4px; height: 24px; border-radius: 4px; background: var(--text-primary); animation: popIn 0.2s ease both; }
.server-icon.add-server { background: transparent; border: 1.5px dashed var(--border-subtle); color: var(--text-secondary); animation: none; }
.server-icon.add-server:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ---------- Channel sidebar ---------- */
.channel-sidebar { width: 240px; flex-shrink: 0; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); animation: slideInLeft 0.25s ease both; }
.channel-sidebar.empty { align-items: center; justify-content: center; padding: 24px; }
.empty-hint { color: var(--text-muted); text-align: center; font-size: 14px; }
.server-header { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border-subtle); font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.server-header-emoji { font-size: 18px; }
.server-header-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.channel-list { flex: 1; overflow-y: auto; padding: 12px 8px; }
.channel-list-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 4px 8px 6px; }
.channel-item { position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--text-secondary); font-size: 14.5px; font-family: var(--font-body); cursor: pointer; text-align: left; margin-bottom: 2px; transition: background 0.15s, color 0.15s; }
.channel-item:hover { color: var(--text-primary); background: var(--bg-hover); }
.channel-item.active { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.channel-item.add-channel { color: var(--text-muted); }
.channel-item.add-channel:hover { color: var(--accent); background: transparent; }
.channel-item > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.user-panel { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--bg-elevated); border-top: 1px solid var(--border-subtle); }
.user-panel-name { flex: 1; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.15s, color 0.15s, transform 0.15s; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

/* ---------- Chat area ---------- */
.chat-area { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-chat); }
.chat-area.empty-state { align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); text-align: center; }
.chat-area.empty-state svg { animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
.chat-area.empty-state h2 { font-family: var(--font-display); color: var(--text-primary); margin: 8px 0 0; }
.chat-area.empty-state p { margin: 0; font-size: 14px; }
.chat-header { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border-subtle); font-weight: 600; color: var(--text-primary); }
.chat-header span:nth-of-type(1) { flex: 1; }
.members-toggle { margin-left: auto; }
.message-list { flex: 1; overflow-y: auto; padding: 16px 20px 8px; display: flex; flex-direction: column; }
.channel-empty { padding: 24px 4px 20px; color: var(--text-muted); animation: fadeIn 0.3s ease both; }
.channel-empty h3 { font-family: var(--font-display); color: var(--text-primary); margin: 10px 0 4px; }
.channel-empty p { margin: 0; font-size: 14px; }
.day-divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 600; margin: 18px 0 10px; }
.day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
.day-divider span { padding: 0 12px; white-space: nowrap; }
.message-row { display: flex; gap: 14px; padding: 2px 8px; border-radius: var(--radius-sm); margin-top: 14px; animation: messageIn 0.25s ease both; position: relative; }
.message-row:hover { background: rgba(255,255,255,0.02); }
.message-row.grouped { margin-top: 2px; }
.message-time-gutter { width: 38px; flex-shrink: 0; font-size: 10.5px; color: var(--text-muted); opacity: 0; padding-top: 3px; text-align: right; }
.message-row.grouped:hover .message-time-gutter { opacity: 1; }
.message-body { flex: 1; min-width: 0; }
.message-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; min-width: 0; }
.message-author { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 60%; }
.message-time { font-size: 11px; color: var(--text-muted); }
.message-content { font-size: 14.5px; line-height: 1.5; color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; }

.message-input-area { flex-shrink: 0; display: flex; align-items: flex-end; gap: 10px; margin: 8px 20px 18px; background: var(--bg-elevated); border-radius: var(--radius-md); padding: 10px 10px 10px 16px; border: 1px solid var(--border-subtle); transition: border-color 0.15s ease; }
.message-input-area:focus-within { border-color: var(--accent); }
.message-input-area textarea { flex: 1; min-width: 0; background: transparent; border: none; outline: none; resize: none; color: var(--text-primary); font-family: var(--font-body); font-size: 14.5px; line-height: 1.4; max-height: 140px; padding: 6px 0; }
.message-input-area textarea::placeholder { color: var(--text-muted); }
.send-btn { width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--accent); color: #1a1508; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.15s, transform 0.1s; }
.send-btn:disabled { background: var(--bg-hover); color: var(--text-muted); cursor: default; }
.send-btn:not(:disabled):hover { background: var(--accent-hover); }
.send-btn:not(:disabled):active { transform: scale(0.9); }

/* ---------- Member sidebar ---------- */
.member-sidebar { width: 240px; flex-shrink: 0; background: var(--bg-sidebar); border-left: 1px solid var(--border-subtle); overflow-y: auto; padding: 16px 12px; animation: slideInRight 0.3s cubic-bezier(0.22,1,0.36,1) both; }
.member-section { margin-bottom: 18px; }
.member-section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 0 8px 8px; }
.member-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; animation: fadeIn 0.25s ease both; }
.member-item:hover { background: var(--bg-hover); }
.member-item.dim { color: var(--text-muted); opacity: 0.6; }

/* ---------- Avatar ---------- */
.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; color: #1a1508; }
.status-dot { position: absolute; bottom: -1px; right: -1px; width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--bg-sidebar); animation: popIn 0.25s ease both; }
.status-dot.online { background: var(--online); }
.status-dot.offline { background: var(--text-muted); }

/* ---------- Modals ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(10, 9, 15, 0.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; animation: fadeIn 0.15s ease both; }
.modal { width: 100%; max-width: 420px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; max-height: 85vh; overflow-y: auto; animation: modalIn 0.25s cubic-bezier(0.22,1,0.36,1) both; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-header h3 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.modal-close { transition: transform 0.2s ease, background 0.15s, color 0.15s; }
.modal-close:hover { transform: rotate(90deg); background: var(--bg-hover); color: var(--text-primary); }
.modal-tabs { position: relative; display: flex; gap: 4px; background: var(--bg-deepest); padding: 4px; border-radius: 10px; margin-bottom: 16px; }
.modal-tabs .tab-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 6px); background: var(--accent); border-radius: 8px; transition: transform 0.25s cubic-bezier(0.22,1,0.36,1); z-index: 0; }
.modal-tabs button { position: relative; z-index: 1; flex: 1; padding: 8px; border-radius: 8px; border: none; background: transparent; color: var(--text-secondary); font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: color 0.15s; }
.modal-tabs button.active { color: #1a1508; }
.join-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; animation: fadeIn 0.2s ease both; }
.join-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg-deepest); }
.join-emoji { font-size: 20px; }
.join-name { flex: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted-note { color: var(--text-muted); font-size: 13.5px; text-align: center; padding: 20px 0; }
.create-server-form { display: flex; flex-direction: column; gap: 14px; animation: fadeIn 0.2s ease both; }
.emoji-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.emoji-opt { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid transparent; background: var(--bg-deepest); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, border-color 0.15s, background 0.15s; }
.emoji-opt:hover { transform: scale(1.08); }
.emoji-opt:active { transform: scale(0.85); }
.emoji-opt.active { border-color: var(--accent); background: var(--accent-soft); }
.channel-name-input { display: flex; align-items: center; gap: 6px; background: var(--bg-deepest); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0 10px; color: var(--text-muted); }
.channel-name-input input { border: none !important; background: transparent !important; padding-left: 0 !important; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-secondary); font-weight: 600; overflow: hidden; }
.field input, .channel-name-input input { background: var(--bg-deepest); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text-primary); font-size: 14.5px; font-family: var(--font-body); outline: none; transition: border-color 0.15s ease; width: 100%; }
.field input:focus, .channel-name-input input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--text-muted); }

.btn-primary { background: var(--accent); color: #1a1508; border: none; border-radius: var(--radius-sm); padding: 11px 16px; font-weight: 700; font-size: 14.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-body); width: 100%; transition: background 0.15s, transform 0.1s; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-primary:active:not(:disabled) { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.6; cursor: default; }
.btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: none; border-radius: var(--radius-sm); padding: 7px 14px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: var(--font-body); flex-shrink: 0; transition: background 0.15s, color 0.15s, transform 0.1s; }
.btn-secondary:hover:not(:disabled) { background: var(--accent); color: #1a1508; }
.btn-secondary:active:not(:disabled) { transform: scale(0.95); }

/* ---------- Auth screen ---------- */
.auth-shell { display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.starfield { position: absolute; inset: 0; overflow: hidden; }
.star { position: absolute; border-radius: 50%; background: #ffffff; animation-name: twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.auth-glow { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.35; animation: drift 12s ease-in-out infinite alternate; }
.auth-glow.g1 { width: 340px; height: 340px; background: var(--accent); top: -80px; left: -60px; }
.auth-glow.g2 { width: 300px; height: 300px; background: var(--violet); bottom: -100px; right: -60px; animation-duration: 15s; }
.auth-glow.g3 { width: 220px; height: 220px; background: var(--online); top: 40%; left: 60%; opacity: 0.15; animation-duration: 18s; }
@media (prefers-reduced-motion: reduce) { .star, .auth-glow { animation: none; } }
.auth-card { position: relative; z-index: 1; width: 100%; max-width: 380px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 32px 28px; margin: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 24px; }
.logo-svg { animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
.logo-path { animation: logoPulse 3.2s ease-in-out infinite; transform-origin: center; }
.auth-tagline { color: var(--text-muted); font-size: 13.5px; margin: 6px 0 22px; }
.auth-tabs { position: relative; display: flex; gap: 4px; background: var(--bg-deepest); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
.auth-tabs .tab-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 6px); background: var(--accent); border-radius: 8px; transition: transform 0.25s cubic-bezier(0.22,1,0.36,1); z-index: 0; }
.auth-tabs button { position: relative; z-index: 1; flex: 1; padding: 9px; border-radius: 8px; border: none; background: transparent; color: var(--text-secondary); font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: var(--font-body); transition: color 0.15s; }
.auth-tabs button.active { color: #1a1508; }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.field-collapsed { max-height: 0; opacity: 0; margin-bottom: -14px; pointer-events: none; }
.field-expanded { max-height: 80px; opacity: 1; transition: max-height 0.25s ease, opacity 0.2s ease, margin-bottom 0.25s ease; }
.field-collapsed { transition: max-height 0.2s ease, opacity 0.15s ease, margin-bottom 0.2s ease; }
.auth-error { background: var(--danger-soft); color: var(--danger); font-size: 13px; padding: 9px 12px; border-radius: var(--radius-sm); line-height: 1.4; animation: errorIn 0.2s ease both; }
.confirm-panel { text-align: center; padding: 10px 4px 4px; color: var(--text-secondary); animation: fadeIn 0.25s ease both; }
.confirm-panel svg { color: var(--accent); margin-bottom: 10px; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
.confirm-panel h2 { font-family: var(--font-display); color: var(--text-primary); margin: 0 0 8px; }
.confirm-panel p { font-size: 14px; margin: 0 0 20px; }

.btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px 16px; background: #ffffff; color: #1f1f1f; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; cursor: pointer; font-family: var(--font-body); transition: background 0.15s, transform 0.1s; margin-bottom: 14px; }
.btn-google:hover { background: #f2f2f2; }
.btn-google:active { transform: scale(0.98); }
.auth-divider { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 12px; margin: 0 0 16px; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
.claim-panel { text-align: center; }
.claim-panel p { color: var(--text-secondary); font-size: 13.5px; margin: 4px 0 20px; }

/* ---------- Loading ---------- */
.loading-screen { display: flex; align-items: center; justify-content: center; }
.loading-screen .logo-svg { animation: spin 1.6s linear infinite; }
.spin { animation: spin 0.8s linear infinite; color: var(--accent); }

/* ---------- Toast ---------- */
.toast-error { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #2b0d0e; padding: 12px 18px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600; cursor: pointer; z-index: 100; max-width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.35); animation: modalIn 0.2s ease both; }

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .channel-sidebar { width: 200px; }

function hashStr(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
    hash |= 0;
  }
  return Math.abs(hash);

function isSameDay(a, b) {

/* ---------- Rich text: **bold**, *italic*, ==highlight== -> safe React nodes (never raw HTML) ---------- */
function parseFormatting(text) {
  if (!text) return text;
  const pattern = /\*\*(.+?)\*\*|\*(.+?)\*|==(.+?)==/;
  const parts = [];
  let remaining = text;
  let key = 0;
  let guard = 0;
  while (remaining.length > 0 && guard < 500) {
    guard++;
    const match = remaining.match(pattern);
    if (!match) { parts.push(remaining); break; }
    const idx = match.index;
    if (idx > 0) parts.push(remaining.slice(0, idx));
    if (match[1] !== undefined) parts.push(<strong key={key++}>{match[1]}</strong>);
    else if (match[2] !== undefined) parts.push(<em key={key++}>{match[2]}</em>);
    else if (match[3] !== undefined) parts.push(<mark key={key++}>{match[3]}</mark>);
    remaining = remaining.slice(idx + match[0].length);
  }
  if (remaining.length > 0 && guard >= 500) parts.push(remaining);
  return parts;
}

async function sbFetch(path, options) {
  options = options || {};
  const method = options.method || 'GET';
  const body = options.body;
  const token = options.token;
  const extraHeaders = options.extraHeaders || {};
  const headers = Object.assign({
    apikey: SUPABASE_ANON_KEY,
    Authorization: 'Bearer ' + (token || SUPABASE_ANON_KEY),
    'Content-Type': 'application/json',
  }, extraHeaders);
  const res = await fetch(SUPABASE_URL + path, {
    method: method,
    headers: headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try {
    const text = await res.text();
    data = text ? JSON.parse(text) : null;
  } catch (e) {
    data = null;
  }
  if (!res.ok) {
    const msg = (data && (data.msg || data.error_description || data.message || data.error)) || ('Request failed (' + res.status + ')');
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* OAuth redirects land back with tokens in the URL hash, e.g.
   #access_token=...&refresh_token=...&expires_in=...&token_type=bearer */
function parseHashParams() {
  const hash = window.location.hash && window.location.hash[0] === '#' ? window.location.hash.slice(1) : window.location.hash;
  if (!hash) return null;
  const params = new URLSearchParams(hash);
  if (params.get('access_token')) {
    return { access_token: params.get('access_token'), refresh_token: params.get('refresh_token') };
  }
  if (params.get('error')) {
    return { error: params.get('error_description') || params.get('error') };
  }
  return null;
}

/* ============================== AUTH SCREEN ============================== */
function AuthScreen(props) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [username, setUsername] = useState('');
  const [localError, setLocalError] = useState('');

  useEffect(function () { setLocalError(''); }, [mode]);

  function handleSubmit(e) {
    e.preventDefault();
    setLocalError('');
    if (mode === 'signup') {
      const trimmed = username.trim();
      if (trimmed.length < 3 || trimmed.length > 20) { setLocalError('Username must be 3-20 characters.'); return; }
      if (!/^[a-zA-Z0-9_]+$/.test(trimmed)) { setLocalError('Username can only contain letters, numbers, and underscores.'); return; }
      if (password.length < 6) { setLocalError('Password must be at least 6 characters.'); return; }
      props.onSignup(email.trim(), password, trimmed);
    } else {
      props.onLogin(email.trim(), password);
    }
  }

  const shownError = localError || props.error;

  if (props.pendingConfirmation) {
    return (
      <div className="auth-shell">
        <Starfield />
        <div className="auth-glow g1" /><div className="auth-glow g2" /><div className="auth-glow g3" />
        <div className="auth-card">
          <div className="brand"><Logo /> Kizuna</div>
          <div className="confirm-panel">
            <IconSparkle size={32} />
            <h2>Check your inbox</h2>
            <p>We sent a confirmation link to your email. Click it, then come back and log in.</p>
            <button className="btn-primary" type="button" onClick={function () { setMode('login'); props.onBackToLogin(); }}>Back to log in</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="auth-shell">
      <Starfield />
      <div className="auth-glow g1" /><div className="auth-glow g2" /><div className="auth-glow g3" />
      <div className="auth-card">
        <div className="brand"><Logo /> Kizuna</div>
        <p className="auth-tagline">A cozy corner for you and your people.</p>

        <button type="button" className="btn-google" onClick={props.onGoogleLogin}>
          <IconGoogle size={18} />
          Continue with Google
        </button>
        <div className="auth-divider"><span>or use email</span></div>

        <div className="auth-tabs">
          <span className="tab-pill" style={{ transform: mode === 'signup' ? 'translateX(calc(100% + 4px))' : 'translateX(0)' }} />
          <button type="button" className={mode === 'login' ? 'active' : ''} onClick={function () { setMode('login'); }}>Log in</button>
          <button type="button" className={mode === 'signup' ? 'active' : ''} onClick={function () { setMode('signup'); }}>Sign up</button>
        </div>

        <form onSubmit={handleSubmit} className="auth-form">
          <label className={'field ' + (mode === 'signup' ? 'field-expanded' : 'field-collapsed')}>
            <span>Username</span>
            <input value={username} onChange={function (e) { setUsername(e.target.value); }} placeholder="e.g. moonlantern" autoComplete="username" />
          </label>

          <label className="field">
            <span>Email</span>
            <input type="email" value={email} onChange={function (e) { setEmail(e.target.value); }} placeholder="you@example.com" autoComplete="email" required />
          </label>
          <label className="field">
            <span>Password</span>
            <input type="password" value={password} onChange={function (e) { setPassword(e.target.value); }} placeholder="••••••••" autoComplete={mode === 'login' ? 'current-password' : 'new-password'} required />
          </label>

          {shownError && <div className="auth-error">{shownError}</div>}

          <button className="btn-primary" type="submit" disabled={props.busy}>
            {props.busy ? <Spinner size={16} /> : mode === 'login' ? 'Log in' : 'Create account'}
          </button>
        </form>
      </div>
    </div>
  );
}

function ClaimUsernameScreen(props) {
  const [username, setUsername] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    const trimmed = username.trim();
    if (trimmed.length < 3 || trimmed.length > 20) { setError('Username must be 3-20 characters.'); return; }
    if (!/^[a-zA-Z0-9_]+$/.test(trimmed)) { setError('Letters, numbers, and underscores only.'); return; }
    setError('');
    props.onSubmit(trimmed, setError, setBusy);
  }

  return (
    <div className="auth-shell">
      <Starfield />
      <div className="auth-glow g1" /><div className="auth-glow g2" /><div className="auth-glow g3" />
      <div className="auth-card">
        <div className="brand"><Logo /> Kizuna</div>
        <div className="claim-panel">
          <p>You're signed in with Google — pick a username to finish setting up your account.</p>
        </div>
        <form onSubmit={handleSubmit} className="auth-form">
          <label className="field">
            <span>Username</span>

          {error && <div className="auth-error">{error}</div>}

  );

function MessageEditBox(props) {
  const [text, setText] = useState(props.initialText);
  const ref = useRef(null);
  useEffect(function () {
    if (ref.current) { ref.current.focus(); ref.current.setSelectionRange(text.length, text.length); }
  }, []);
  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); props.onSave(text); }
    if (e.key === 'Escape') props.onCancel();
  }
  return (
    <div className="message-edit-box">
      <textarea ref={ref} value={text} onChange={function (e) { setText(e.target.value); }} onKeyDown={handleKeyDown} rows={2} />
      <div className="message-edit-actions">
        <button type="button" className="save-btn" onClick={function () { props.onSave(text); }}>Save</button>
        <button type="button" className="cancel-btn" onClick={props.onCancel}>Cancel</button>
        <span className="message-edit-hint">escape to cancel • enter to save</span>
      </div>
    </div>
  );
}

function ChatArea(props) {
  const inputRef = useRef(null);
  const fileInputRef = useRef(null);
  const [editingId, setEditingId] = useState(null);

  useEffect(function () {
    if (inputRef.current && props.messageInput === '') inputRef.current.style.height = 'auto';
  }, [props.messageInput]);

  function handleInput(e) {
    props.setMessageInput(e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
  }
  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (props.messageInput.trim() || props.stagedFile) props.onSend();
    }
  }
  function handleFilePick(e) {
    const file = e.target.files && e.target.files[0];
    if (file) props.onStageFile(file);
    e.target.value = '';
  }
  function insertEmoji(em) {
    props.setMessageInput(props.messageInput + em);
    if (inputRef.current) inputRef.current.focus();
  }

  if (props.emptyMode) {
    return (
      <div className="chat-area empty-state">
        {props.emptyIcon}
        <h2>{props.emptyTitle}</h2>
        <p>{props.emptyBody}</p>
      </div>
    );
  }

  return (
    <div className="chat-area">
      <div className="chat-header">
        {props.headerIcon}
        <span>{props.title}</span>
        {props.onToggleMembers && (
          <button className="icon-btn members-toggle" onClick={props.onToggleMembers} title="Toggle members" type="button">
            <IconUsers size={18} />
          </button>
        )}
      </div>
      <div className="message-list" ref={props.listRef} onScroll={props.onScroll}>
        {props.messages.length === 0 && (
          <div className="channel-empty">
            {props.headerIcon}
            <h3>{props.startTitle}</h3>
            <p>{props.startBody}</p>
          </div>
        )}
        {props.messages.map(function (m, idx) {
          const prev = props.messages[idx - 1];
          const grouped = !!prev && prev.user_id === m.user_id && (new Date(m.created_at) - new Date(prev.created_at)) < 5 * 60 * 1000 && isSameDay(m.created_at, prev.created_at) && !prev.attachment_url && !m.attachment_url;
          const showDayDivider = !prev || !isSameDay(prev.created_at, m.created_at);
          const username = (m.profiles && m.profiles.username) || 'Unknown';
          const avatarUrl = m.profiles && m.profiles.avatar_url;
          const isImage = m.attachment_type && m.attachment_type.indexOf('image/') === 0;
          const isMine = m.user_id === props.currentUserId;
          const isEditing = editingId === m.id;
          return (
            <Fragment key={m.id}>
              {showDayDivider && <div className="day-divider"><span>{dayLabel(m.created_at)}</span></div>}
              <div className={'message-row ' + (grouped ? 'grouped' : '')}>
                {!grouped ? <Avatar username={username} avatarUrl={avatarUrl} size={38} /> : <span className="message-time-gutter">{formatTime(m.created_at)}</span>}
                <div className="message-body">
                  {!grouped && (
                    <div className="message-meta">
                      <span className="message-author" style={{ color: colorForUsername(username) }}>{username}</span>
                      <span className="message-time">{formatTime(m.created_at)}</span>
                      {m.edited_at && <span className="message-edited-tag">(edited)</span>}
                    </div>
                  )}
                  {isEditing ? (
                    <MessageEditBox
                      initialText={m.content || ''}
                      onCancel={function () { setEditingId(null); }}
                      onSave={function (text) {
                        const trimmed = text.trim();
                        if (trimmed) props.onEditMessage(m.id, trimmed);
                        setEditingId(null);
                      }}
                    />
                  ) : (
                    <React.Fragment>
                      {m.content && <div className="message-content">{parseFormatting(m.content)}{m.edited_at && grouped && <span className="message-edited-tag">(edited)</span>}</div>}
                      {m.attachment_url && (
                        <div className="message-attachment">
                          {isImage ? (
                            <img src={m.attachment_url} alt={m.attachment_name || 'attachment'} onClick={function () { window.open(m.attachment_url, '_blank'); }} />
                          ) : (
                            <a className="file-attachment-card" href={m.attachment_url} target="_blank" rel="noopener noreferrer">
                              <span className="file-attachment-icon"><IconFile size={18} /></span>
                              <span className="file-attachment-info">
                                <span className="file-attachment-name">{m.attachment_name || 'File'}</span>
                                <span className="file-attachment-size">{formatFileSize(m.attachment_size)}</span>
                              </span>
                            </a>
                          )}
                        </div>
                      )}
                    </React.Fragment>
                  )}
                </div>
                {isMine && !isEditing && (
                  <div className="message-actions">
                    {m.content !== null && m.content !== undefined && (
                      <button type="button" title="Edit" onClick={function () { setEditingId(m.id); }}><IconEdit size={14} /></button>
                    )}
                    <button type="button" className="danger" title="Delete" onClick={function () { if (window.confirm('Delete this message?')) props.onDeleteMessage(m.id); }}><IconTrash size={14} /></button>
                  </div>
                )}
              </div>
            </Fragment>
          );
        })}
      </div>
      {props.stagedFile && (
        <div className="staged-file">
          <span className="staged-file-icon">
            {props.stagedFile.type && props.stagedFile.type.indexOf('image/') === 0 && props.stagedPreviewUrl ? (
              <img src={props.stagedPreviewUrl} alt="" />
            ) : <IconFile size={16} />}
          </span>
          <span className="staged-file-info">
            <span className="staged-file-name">{props.stagedFile.name}</span>
            <span className="staged-file-size">{props.uploading ? 'Uploading…' : formatFileSize(props.stagedFile.size)}</span>
          </span>
          <button className="icon-btn staged-file-remove" onClick={props.onClearStagedFile} type="button" title="Remove"><IconX size={16} /></button>
        </div>
      )}
      <div className="message-input-area">
        <input ref={fileInputRef} type="file" style={{ display: 'none' }} onChange={handleFilePick} />
        <button className="icon-btn attach-btn" type="button" title="Attach a file" onClick={function () { fileInputRef.current && fileInputRef.current.click(); }}>
          <IconPaperclip size={18} />
        </button>
        <EmojiPickerButton onPick={insertEmoji} />
        <textarea ref={inputRef} value={props.messageInput} onChange={handleInput} onKeyDown={handleKeyDown} placeholder={props.placeholder} rows={1} />
        <button className="send-btn" onClick={props.onSend} disabled={(!props.messageInput.trim() && !props.stagedFile) || props.sending || props.uploading} type="button">
          <IconSend size={18} />
        </button>
      </div>
    </div>
  );
}

function MemberSidebar(props) {
  const online = props.members.filter(function (m) { return isOnline(m.profiles && m.profiles.last_seen); });
  const offline = props.members.filter(function (m) { return !isOnline(m.profiles && m.profiles.last_seen); });
  function statusLine(m) {
    const p = m.profiles;
    if (!p) return null;
    if (p.activity_text) return ((p.activity_icon || '🎮') + ' Playing ' + p.activity_text);
    if (p.status_text) return ((p.status_emoji || '') + ' ' + p.status_text).trim();
    return null;
  }
  function handleClick(m) {
    if (m.user_id !== props.myId) props.onStartDm(m.user_id, m.profiles);
  }
  return (
    <div className="member-sidebar">
      {online.length > 0 && (
        <div className="member-section">
          <div className="member-section-label">Online — {online.length}</div>
          {online.map(function (m) {
            const status = statusLine(m);
            const clickable = m.user_id !== props.myId;
            return (
              <div className={'member-item ' + (clickable ? 'clickable' : '')} key={m.user_id} onClick={function () { handleClick(m); }} title={clickable ? 'Message ' + (m.profiles && m.profiles.username) : ''}>
                <Avatar username={m.profiles && m.profiles.username} avatarUrl={m.profiles && m.profiles.avatar_url} size={32} online={true} />
                <div className="member-item-text">
                  <span>{m.profiles && m.profiles.username}</span>
                  {status && <span className="member-item-status">{status}</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {offline.length > 0 && (
        <div className="member-section">
          <div className="member-section-label">Offline — {offline.length}</div>
          {offline.map(function (m) {
            const clickable = m.user_id !== props.myId;
            return (
              <div className={'member-item dim ' + (clickable ? 'clickable' : '')} key={m.user_id} onClick={function () { handleClick(m); }} title={activityLabel(m.profiles && m.profiles.last_seen)}>
                <Avatar username={m.profiles && m.profiles.username} avatarUrl={m.profiles && m.profiles.avatar_url} size={32} online={false} />
                <div className="member-item-text">
                  <span>{m.profiles && m.profiles.username}</span>
                  <span className="member-item-status">{activityLabel(m.profiles && m.profiles.last_seen)}</span>

            );

      )}

}

const STATUS_EMOJIS = ['😀', '🎮', '💻', '📚', '🎵', '☕', '🌙', '💤', '🔥', '❤️', '🚀', '✨', '🏖️', '🎧', '🍕', ''];

function SettingsModal(props) {
  const profile = props.profile;
  const [tab, setTab] = useState('profile');
  const [username, setUsername] = useState(profile.username || '');
  const [statusText, setStatusText] = useState(profile.status_text || '');
  const [statusEmoji, setStatusEmoji] = useState(profile.status_emoji || '');
  const [activityId, setActivityId] = useState(function () {
    const found = ACTIVITIES.find(function (a) { return a.name === profile.activity_text; });
    return found ? found.id : '';
  });
  const [showEmojiPicker, setShowEmojiPicker] = useState(false);
  const [avatarFile, setAvatarFile] = useState(null);
  const [avatarPreview, setAvatarPreview] = useState(profile.avatar_url || null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);

  function handlePickAvatar(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { setError('Images must be under 5MB.'); return; }
    setError('');
    setAvatarFile(file);
    const reader = new FileReader();
    reader.onload = function () { setAvatarPreview(reader.result); };
    reader.readAsDataURL(file);
  }

  function handleSave(e) {
    e.preventDefault();
    const trimmed = username.trim();
    if (trimmed.length < 3 || trimmed.length > 20) { setError('Username must be 3-20 characters.'); return; }
    if (!/^[a-zA-Z0-9_]+$/.test(trimmed)) { setError('Letters, numbers, and underscores only.'); return; }
    setError('');
    const activity = ACTIVITIES.find(function (a) { return a.id === activityId; });
    props.onSaveProfile({
      username: trimmed, status_text: statusText.trim(), status_emoji: statusEmoji, avatarFile: avatarFile,
      activity_text: activity ? activity.name : null, activity_icon: activity ? activity.icon : null,
    }, setError, setBusy, function () { props.onClose(); });
  }

  return (
    <ModalShell title="Settings" onClose={props.onClose}>
      <div className="modal-tabs">
        <span className="tab-pill" style={{ transform: tab === 'appearance' ? 'translateX(calc(100% + 4px))' : 'translateX(0)' }} />
        <button type="button" className={tab === 'profile' ? 'active' : ''} onClick={function () { setTab('profile'); }}>Profile</button>
        <button type="button" className={tab === 'appearance' ? 'active' : ''} onClick={function () { setTab('appearance'); }}>Appearance</button>
      </div>

      {tab === 'profile' ? (
        <form onSubmit={handleSave} className="create-server-form">
          <div className="avatar-upload-row">
            <button type="button" className="avatar-upload-btn" onClick={function () { fileInputRef.current && fileInputRef.current.click(); }}>
              <Avatar username={username || profile.username} avatarUrl={avatarPreview} size={64} />
              <span className="avatar-edit-badge"><IconCamera size={13} /></span>
            </button>
            <input ref={fileInputRef} type="file" accept="image/png,image/jpeg,image/gif,image/webp" style={{ display: 'none' }} onChange={handlePickAvatar} />
            <span className="avatar-upload-hint">Click to upload a photo.<br />PNG, JPG, GIF, or WEBP, up to 5MB.</span>
          </div>

          <label className="field">
            <span>Username</span>
            <input value={username} onChange={function (e) { setUsername(e.target.value); }} maxLength={20} />
          </label>

          <label className="field">
            <span>Status</span>
            <div className="status-row">
              <button type="button" className="status-emoji-btn" onClick={function () { setShowEmojiPicker(function (v) { return !v; }); }}>
                {statusEmoji || '🙂'}
              </button>
              <input value={statusText} onChange={function (e) { setStatusText(e.target.value); }} placeholder="What's happening?" maxLength={60} style={{ flex: 1 }} />
            </div>
            {showEmojiPicker && (
              <div className="status-emoji-popover">
                {STATUS_EMOJIS.map(function (em, i) {
                  return <button key={i} type="button" onClick={function () { setStatusEmoji(em); setShowEmojiPicker(false); }}>{em || '—'}</button>;
                })}
              </div>
            )}
          </label>

          <label className="field">
            <span>Currently playing / using (shown to others, optional)</span>
            <div className="activity-picker">
              <button type="button" className={'activity-opt ' + (activityId === '' ? 'active' : '')} onClick={function () { setActivityId(''); }}>
                <span>🚫</span><span>None</span>
              </button>
              {ACTIVITIES.map(function (a) {
                return (
                  <button key={a.id} type="button" className={'activity-opt ' + (activityId === a.id ? 'active' : '')} onClick={function () { setActivityId(a.id); }}>
                    <span>{a.icon}</span><span>{a.name}</span>
                  </button>
                );
              })}
            </div>
          </label>

          {error && <div className="auth-error">{error}</div>}

          <button className="btn-primary" type="submit" disabled={busy}>
            {busy ? <Spinner size={16} /> : 'Save changes'}
          </button>
        </form>
      ) : (
        <div className="create-server-form">
          <div>
            <div className="settings-section-label">Theme</div>
            <div className="theme-toggle-row">
              <button type="button" className={'theme-opt ' + (props.theme === 'dark' ? 'active' : '')} onClick={function () { props.onThemeChange('dark'); }}>
                <span className="theme-opt-swatch"><span style={{ background: '#15141f' }} /><span style={{ background: '#201f2e' }} /></span>
                <IconMoon size={14} /> Dark
              </button>
              <button type="button" className={'theme-opt ' + (props.theme === 'light' ? 'active' : '')} onClick={function () { props.onThemeChange('light'); }}>
                <span className="theme-opt-swatch"><span style={{ background: '#f3f2f9' }} /><span style={{ background: '#ffffff' }} /></span>
                <IconSun size={14} /> Light
              </button>
            </div>
          </div>
          <div>
            <div className="settings-section-label">Accent color</div>
            <div className="accent-picker">
              {ACCENT_PRESETS.map(function (preset) {
                const active = props.accentHex.toLowerCase() === preset.hex.toLowerCase();
                return (
                  <button key={preset.hex} type="button" title={preset.name} className={'accent-swatch ' + (active ? 'active' : '')} style={{ background: preset.hex }} onClick={function () { props.onAccentChange(preset); }}>
                    {active && <IconCheck size={14} />}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </ModalShell>
  );
}

function App() {
  const [booting, setBooting] = useState(true);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authBusy, setAuthBusy] = useState(false);
  const [authError, setAuthError] = useState('');
  const [pendingConfirmation, setPendingConfirmation] = useState(false);
  const [needsUsername, setNeedsUsername] = useState(false);

  const [servers, setServers] = useState([]);
  const [myServerIds, setMyServerIds] = useState(new Set());
  const [currentServerId, setCurrentServerId] = useState(null);
  const [channels, setChannels] = useState([]);
  const [currentChannelId, setCurrentChannelId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [members, setMembers] = useState([]);
  const [messageInput, setMessageInput] = useState('');
  const [sending, setSending] = useState(false);

  const [view, setView] = useState('server');
  const [dmThreads, setDmThreads] = useState([]);
  const [currentDmThreadId, setCurrentDmThreadId] = useState(null);
  const [dmMessages, setDmMessages] = useState([]);
  const dmLastMsgTimeRef = useRef(null);

  const [membersOpen, setMembersOpen] = useState(function () { return typeof window !== 'undefined' ? window.innerWidth > 900 : true; });
  const [showAddServer, setShowAddServer] = useState(false);
  const [showAddChannel, setShowAddChannel] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [modalBusy, setModalBusy] = useState(false);
  const [fatalError, setFatalError] = useState('');

  const [stagedFile, setStagedFile] = useState(null);
  const [stagedPreviewUrl, setStagedPreviewUrl] = useState(null);
  const [uploading, setUploading] = useState(false);

  const [theme, setTheme] = useState('dark');
  const [accentHex, setAccentHex] = useState(ACCENT_PRESETS[0].hex);

  const listRef = useRef(null);
  const stickToBottomRef = useRef(true);
  const lastMsgTimeRef = useRef(null);

  /* ---- theme: load saved prefs once, apply to <html> ---- */
  useEffect(function () {
    const prefs = loadThemePrefs();
    setTheme(prefs.theme);
    setAccentHex(prefs.accentHex);
    applyTheme(prefs.theme);
    const preset = ACCENT_PRESETS.find(function (p) { return p.hex === prefs.accentHex; }) || ACCENT_PRESETS[0];
    applyAccent(preset);
  }, []);

  function handleThemeChange(nextTheme) {
    setTheme(nextTheme);
    applyTheme(nextTheme);
    saveThemePrefs(nextTheme, accentHex);
  }
  function handleAccentChange(preset) {
    setAccentHex(preset.hex);
    applyAccent(preset);
    saveThemePrefs(theme, preset.hex);
  }

  function handleStageFile(file) {
    setStagedFile(file);
    if (file.type && file.type.indexOf('image/') === 0) {
      const reader = new FileReader();
      reader.onload = function () { setStagedPreviewUrl(reader.result); };
      reader.readAsDataURL(file);
    } else {
      setStagedPreviewUrl(null);
    }
  }
  function handleClearStagedFile() {
    setStagedFile(null);
    setStagedPreviewUrl(null);
  }

  async function handleSaveProfile(updates, setError, setBusy, onDone) {
    setBusy(true);
    try {
      if (updates.username !== profile.username) {
        const existing = await sbFetch('/rest/v1/profiles?username=eq.' + encodeURIComponent(updates.username) + '&select=id');
        if (existing && existing.length > 0 && existing[0].id !== profile.id) {
          setError('That username is taken — try another.');
          setBusy(false);
          return;
        }
      }
      let avatar_url = profile.avatar_url;
      if (updates.avatarFile) {
        const ext = (updates.avatarFile.name.split('.').pop() || 'jpg').toLowerCase();
        const path = profile.id + '/avatar-' + randomId() + '.' + ext;
        avatar_url = await uploadToStorage('avatars', path, updates.avatarFile, session.access_token);
      }
      const updated = await sbFetch('/rest/v1/profiles?id=eq.' + profile.id, {
        method: 'PATCH', token: session.access_token,

    content = (
      <div className="app">
        <ServerRail servers={servers} myServerIds={myServerIds} currentServerId={currentServerId} view={view} onGoHome={handleGoHome} onSelect={function (id) { setCurrentServerId(id); setView('server'); }} onAddClick={function () { setShowAddServer(true); }} />
        {isDmView ? (
          <DmSidebar threads={dmThreads} myId={profile.id} currentThreadId={currentDmThreadId} onSelectThread={setCurrentDmThreadId} profile={profile} onLogout={handleLogout} onOpenSettings={function () { setShowSettings(true); }} />
        ) : (
          <ChannelSidebar server={currentServer} channels={channels} currentChannelId={currentChannelId} onSelectChannel={setCurrentChannelId} onAddChannel={function () { setShowAddChannel(true); }} profile={profile} onLogout={handleLogout} onOpenSettings={function () { setShowSettings(true); }} />
        )}
        <ChatArea
          {...chatProps}
          currentUserId={profile.id}
          messageInput={messageInput}
          setMessageInput={setMessageInput}
          sending={sending}
          listRef={listRef}
          onScroll={handleScroll}
          stagedFile={stagedFile}
          stagedPreviewUrl={stagedPreviewUrl}
          uploading={uploading}
          onStageFile={handleStageFile}
          onClearStagedFile={handleClearStagedFile}
        />
        {!isDmView && membersOpen && currentServer && <MemberSidebar members={members} myId={profile.id} onStartDm={handleStartDm} />}
        {showAddServer && (
          <AddServerModal onClose={function () { setShowAddServer(false); }} servers={servers} myServerIds={myServerIds} onCreate={handleCreateServer} onJoin={handleJoinServer} busy={modalBusy} />
        )}
        {showAddChannel && (
          <AddChannelModal onClose={function () { setShowAddChannel(false); }} onCreate={handleCreateChannel} busy={modalBusy} />
        )}
        {showSettings && (
          <SettingsModal
            profile={profile}
            onClose={function () { setShowSettings(false); }}
            onSaveProfile={handleSaveProfile}
            theme={theme}
            accentHex={accentHex}
            onThemeChange={handleThemeChange}
            onAccentChange={handleAccentChange}
          />
        )}
        {fatalError && <div className="toast-error" onClick={function () { setFatalError(''); }}>{fatalError}</div>}
      </div>
    );
  }

  return <div className="view-fade-in">{content}</div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, {

      filename: 'kizuna.jsx',
    }).code;
    var el = document.createElement('script');
    el.textContent = output;
    document.body.appendChild(el);
  })();
