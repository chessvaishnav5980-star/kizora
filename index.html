function playNotifySound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.24);
  } catch (e) {}
}

function maybeNotifyForMessages(freshMessages, myUserId, contextLabel) {
  if (!freshMessages || !freshMessages.length) return;
  const others = freshMessages.filter(function (m) { return m.user_id !== myUserId && m.sender_id !== myUserId; });
  if (!others.length) return;
  let soundOn = true, desktopOn = false, mentionOnly = false, myUsername = '';
  try { soundOn = localStorage.getItem('kizuna-notif-sound') !== 'false'; } catch (e) {}
  try { desktopOn = localStorage.getItem('kizuna-notif-desktop') === 'true'; } catch (e) {}
  try { mentionOnly = localStorage.getItem('kizuna-notif-mention-only') === 'true'; } catch (e) {}
  try { myUsername = (JSON.parse(localStorage.getItem('kizuna-my-username') || '""')) || ''; } catch (e) {}

  let relevant = others;
  if (mentionOnly && myUsername) {
    relevant = others.filter(function (m) { return m.content && m.content.toLowerCase().indexOf('@' + myUsername.toLowerCase()) !== -1; });
  }
  if (!relevant.length) return;

  if (soundOn) playNotifySound();
  if (desktopOn && typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden) {
    const last = relevant[relevant.length - 1];
    const authorName = (last.profiles && last.profiles.username) || contextLabel || 'New message';
    try {
      new Notification(authorName, { body: (last.content || 'Sent an attachment').slice(0, 120) });
    } catch (e) {}
  }
}

function NotificationsTab() {
  const [desktopEnabled, setDesktopEnabled] = useState(function () {
    try { return localStorage.getItem('kizuna-notif-desktop') === 'true'; } catch (e) { return false; }
  });
  const [soundEnabled, setSoundEnabled] = useState(function () {
    try { return localStorage.getItem('kizuna-notif-sound') !== 'false'; } catch (e) { return true; }
  });
  const [mentionOnly, setMentionOnly] = useState(function () {
    try { return localStorage.getItem('kizuna-notif-mention-only') === 'true'; } catch (e) { return false; }
  });
  const [permissionState, setPermissionState] = useState(function () {
    return (typeof Notification !== 'undefined' && Notification.permission) || 'default';
  });

  async function handleToggleDesktop() {
    if (!desktopEnabled) {
      if (typeof Notification === 'undefined') return;
      const result = await Notification.requestPermission();
      setPermissionState(result);
      if (result !== 'granted') return;
    }
    const next = !desktopEnabled;
    setDesktopEnabled(next);
    try { localStorage.setItem('kizuna-notif-desktop', String(next)); } catch (e) {}
  }

  function handleToggleSound() {
    const next = !soundEnabled;
    setSoundEnabled(next);
    try { localStorage.setItem('kizuna-notif-sound', String(next)); } catch (e) {}
  }

  function handleToggleMentionOnly() {
    const next = !mentionOnly;
    setMentionOnly(next);
    try { localStorage.setItem('kizuna-notif-mention-only', String(next)); } catch (e) {}
  }

  return (
    <div>
      <div className="settings-section-heading">Desktop Notifications</div>
      <div className="settings-row">
        <div className="settings-row-text">
          <div className="settings-row-title">Enable desktop notifications</div>
          <div className="settings-row-desc">
            {permissionState === 'denied' ? 'Blocked in your browser settings — re-enable it there first.' : 'Show a system notification for new messages while this tab is open.'}
          </div>
        </div>
        <button type="button" className={'toggle-switch ' + (desktopEnabled ? 'on' : '')} onClick={handleToggleDesktop} disabled={permissionState === 'denied'} />
      </div>

      <div className="settings-section-heading">Sounds</div>
      <div className="settings-row">
        <div className="settings-row-text">
          <div className="settings-row-title">Play a sound on new message</div>
          <div className="settings-row-desc">A short chime plays when a new message arrives.</div>
        </div>
        <button type="button" className={'toggle-switch ' + (soundEnabled ? 'on' : '')} onClick={handleToggleSound} />
      </div>

      <div className="settings-section-heading">Notify me when...</div>
      <div className="settings-row">
        <div className="settings-row-text">
          <div className="settings-row-title">Only for mentions</div>
          <div className="settings-row-desc">Only notify me when someone @mentions my username, not for every message.</div>
        </div>
        <button type="button" className={'toggle-switch ' + (mentionOnly ? 'on' : '')} onClick={handleToggleMentionOnly} />
      </div>
    </div>
  );
}

    }
  }, [profile && profile.username]);

  useEffect(function () {
    if (!session) return;
    let cancelled = false;
    async function loadStatuses() {
      try {
        const data = await sbFetch('/rest/v1/statuses?expires_at=gt.' + encodeURIComponent(new Date().toISOString()) + '&select=id,user_id,media_url,caption,created_at,profiles(username,avatar_url)&order=created_at.desc', { token: session.access_token });
        if (cancelled) return;
        const byUser = {};
        (data || []).forEach(function (s) { if (!byUser[s.user_id]) byUser[s.user_id] = s; });
        setStatusesByUser(byUser);
      } catch (e) { /* transient */ }
    }
    loadStatuses();
    const interval = setInterval(loadStatuses, 15000);
    return function () { cancelled = true; clearInterval(interval); };
  }, [session]);

  async function handlePostStatus(file, caption, setError, setBusy, onDone) {
    setBusy(true);

        extraHeaders: { Prefer: 'return=representation' },
      });
      setStatusesByUser(function (prev) {
        const next = Object.assign({}, prev);
        next[profile.id] = Object.assign({}, created[0], { profiles: { username: profile.username, avatar_url: profile.avatar_url } });
        return next;
      });
      onDone();
    } catch (e) {
      setError(e.message);

  async function fetchCallLogs() {

  }

  async function fetchMedia() {
    if (view === 'dm' && currentDmThreadId) {
      return await sbFetch('/rest/v1/dm_messages?thread_id=eq.' + currentDmThreadId + '&attachment_url=not.is.null&select=id,attachment_url,attachment_name,attachment_type&order=created_at.desc&limit=60', { token: session.access_token });

    }
    return [];
  }
  const [incomingCall, setIncomingCall] = useState(null);
  const [activeCall, setActiveCall] = useState(null);
  const [micMuted, setMicMuted] = useState(false);
  const [camOff, setCamOff] = useState(false);
  const [localStream, setLocalStream] = useState(null);
  const [remoteStream, setRemoteStream] = useState(null);
  const pcRef = useRef(null);
  const callChannelRef = useRef(null);
  const personalChannelRef = useRef(null);
  const iceQueueRef = useRef([]);
  const remoteDescSetRef = useRef(false);
  const callStartTimeRef = useRef(null);

  function cleanupCall() {
    if (pcRef.current) { try { pcRef.current.close(); } catch (e) {} pcRef.current = null; }
    if (callChannelRef.current) { try { realtimeClient.removeChannel(callChannelRef.current); } catch (e) {} callChannelRef.current = null; }
    setLocalStream(function (s) { if (s) s.getTracks().forEach(function (t) { t.stop(); }); return null; });
    setRemoteStream(null);
    setActiveCall(null);
    setIncomingCall(null);
    setMicMuted(false);
    setCamOff(false);
    iceQueueRef.current = [];
    remoteDescSetRef.current = false;
    callStartTimeRef.current = null;
  }

  function logCallOutcome(peerId, kind, status, isCaller) {
    const duration = callStartTimeRef.current ? Math.round((Date.now() - callStartTimeRef.current) / 1000) : 0;
    const body = isCaller
      ? { caller_id: profile.id, callee_id: peerId, kind: kind, status: status, duration_seconds: duration }
      : { caller_id: peerId, callee_id: profile.id, kind: kind, status: status, duration_seconds: duration };
    sbFetch('/rest/v1/call_logs', { method: 'POST', token: session.access_token, body: body, extraHeaders: { Prefer: 'return=minimal' } }).catch(function () {});
  }

  function setupPeerConnection(callId) {
    const pc = new RTCPeerConnection(ICE_SERVERS);
    pcRef.current = pc;
    pc.onicecandidate = function (e) {
      if (e.candidate) callChannelRef.current.send({ type: 'broadcast', event: 'ice', payload: { candidate: e.candidate } });
    };
    pc.ontrack = function (e) {
      setRemoteStream(e.streams[0]);
    };
    return pc;
  }

  async function flushIceQueue() {
    const pc = pcRef.current;
    for (const cand of iceQueueRef.current) {
      try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
    }
    iceQueueRef.current = [];
  }

  function attachCallChannelListeners(channel, role) {
    channel
      .on('broadcast', { event: 'declined' }, function () {
        const c = activeCallRef.current;
        if (c) logCallOutcome(c.peerId, c.kind, 'declined', c.isCaller);
        setFatalError('Call declined.');
        cleanupCall();
      })
      .on('broadcast', { event: 'cancelled' }, function () {
        const c = activeCallRef.current;
        if (c) logCallOutcome(c.peerId, c.kind, 'missed', c.isCaller);
        cleanupCall();
      })
      .on('broadcast', { event: 'hangup' }, function () {
        const c = activeCallRef.current;
        if (c) logCallOutcome(c.peerId, c.kind, callStartTimeRef.current ? 'completed' : 'missed', c.isCaller);
        cleanupCall();
      })
      .on('broadcast', { event: 'accepted' }, async function () {
        if (role !== 'caller') return;
        setActiveCall(function (prev) { return prev ? Object.assign({}, prev, { status: 'connecting' }) : prev; });
        try {
          const kind = activeCallRef.current.kind;
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === 'video' });
          setLocalStream(stream);
          const pc = setupPeerConnection();
          stream.getTracks().forEach(function (t) { pc.addTrack(t, stream); });
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          channel.send({ type: 'broadcast', event: 'offer', payload: { sdp: offer } });
        } catch (e) {
          setFatalError('Could not access microphone/camera: ' + e.message);
          cleanupCall();
        }
      })
      .on('broadcast', { event: 'offer' }, async function (msg) {
        if (role !== 'callee') return;
        const pc = pcRef.current;
        await pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp));
        remoteDescSetRef.current = true;
        await flushIceQueue();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        channel.send({ type: 'broadcast', event: 'answer', payload: { sdp: answer } });
        callStartTimeRef.current = Date.now();
        setActiveCall(function (prev) { return prev ? Object.assign({}, prev, { status: 'connected' }) : prev; });
      })
      .on('broadcast', { event: 'answer' }, async function (msg) {
        if (role !== 'caller') return;
        const pc = pcRef.current;
        await pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp));
        remoteDescSetRef.current = true;
        await flushIceQueue();
        callStartTimeRef.current = Date.now();
        setActiveCall(function (prev) { return prev ? Object.assign({}, prev, { status: 'connected' }) : prev; });
      })
      .on('broadcast', { event: 'ice' }, async function (msg) {
        if (remoteDescSetRef.current && pcRef.current) {
          try { await pcRef.current.addIceCandidate(new RTCIceCandidate(msg.payload.candidate)); } catch (e) {}
        } else {
          iceQueueRef.current.push(msg.payload.candidate);
        }
      });
  }

  const activeCallRef = useRef(null);
  useEffect(function () { activeCallRef.current = activeCall; }, [activeCall]);

  function startCall(peerId, peerName, peerAvatar, kind) {
    const callId = randomId();
    const channel = realtimeClient.channel('call-' + callId);
    callChannelRef.current = channel;
    attachCallChannelListeners(channel, 'caller');
    channel.subscribe(function (status) {
      if (status === 'SUBSCRIBED') {
        realtimeClient.channel('user-' + peerId).send({
          type: 'broadcast', event: 'incoming_call',
          payload: { callId: callId, callerId: profile.id, callerName: profile.username, callerAvatar: profile.avatar_url, kind: kind },
        });
      }
    });
    setActiveCall({ callId: callId, peerId: peerId, peerName: peerName, peerAvatar: peerAvatar, kind: kind, status: 'calling', isCaller: true });
  }

  function cancelOutgoingCall() {
    if (callChannelRef.current) callChannelRef.current.send({ type: 'broadcast', event: 'cancelled', payload: {} });
    if (activeCall) logCallOutcome(activeCall.peerId, activeCall.kind, 'cancelled', true);
    cleanupCall();
  }

  function acceptIncomingCall() {
    const call = incomingCall;
    setIncomingCall(null);
    const channel = realtimeClient.channel('call-' + call.callId);
    callChannelRef.current = channel;
    setupPeerConnection();
    attachCallChannelListeners(channel, 'callee');
    setActiveCall({ callId: call.callId, peerId: call.callerId, peerName: call.callerName, peerAvatar: call.callerAvatar, kind: call.kind, status: 'connecting', isCaller: false });
    channel.subscribe(async function (status) {
      if (status !== 'SUBSCRIBED') return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: call.kind === 'video' });
        setLocalStream(stream);
        stream.getTracks().forEach(function (t) { pcRef.current.addTrack(t, stream); });
        channel.send({ type: 'broadcast', event: 'accepted', payload: {} });
      } catch (e) {
        setFatalError('Could not access microphone/camera: ' + e.message);
        cleanupCall();
      }
    });
  }

  function declineIncomingCall() {
    const call = incomingCall;
    setIncomingCall(null);
    logCallOutcome(call.callerId, call.kind, 'declined', false);
    const channel = realtimeClient.channel('call-' + call.callId);
    channel.subscribe(function (status) {
      if (status === 'SUBSCRIBED') {
        channel.send({ type: 'broadcast', event: 'declined', payload: {} });
        setTimeout(function () { realtimeClient.removeChannel(channel); }, 500);
      }
    });
  }

  function hangUpCall() {
    if (callChannelRef.current) callChannelRef.current.send({ type: 'broadcast', event: 'hangup', payload: {} });
    if (activeCall) logCallOutcome(activeCall.peerId, activeCall.kind, callStartTimeRef.current ? 'completed' : 'missed', activeCall.isCaller);
    cleanupCall();
  }

  function toggleMic() {
    if (!localStream) return;
    const next = !micMuted;
    localStream.getAudioTracks().forEach(function (t) { t.enabled = !next; });
    setMicMuted(next);
  }
  function toggleCam() {
    if (!localStream) return;
    const next = !camOff;
    localStream.getVideoTracks().forEach(function (t) { t.enabled = !next; });
    setCamOff(next);
  }

  useEffect(function () {
    if (!profile) return;
    const channel = realtimeClient.channel('user-' + profile.id);
    personalChannelRef.current = channel;
    channel
      .on('broadcast', { event: 'incoming_call' }, function (msg) {
        setIncomingCall(msg.payload);
      })
      .subscribe();
    return function () { realtimeClient.removeChannel(channel); };
  }, [profile && profile.id]);


  async function toggleStarMessage(messageId, isDm) {
    const table = isDm ? 'dm_message_stars' : 'message_stars';

  }
  function handleScroll() {
    const el = listRef.current;
    if (!el) return;
    stickToBottomRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 150;
  }

  useEffect(function () {
    if (!currentChannelId || !session) { setMessages([]); return; }
    let cancelled = false;
    lastMsgTimeRef.current = null;
    setMessages([]);

    async function loadInitial() {
      try {
        const data = await sbFetch('/rest/v1/messages?channel_id=eq.' + currentChannelId + '&select=id,content,created_at,user_id,edited_at,attachment_url,attachment_name,attachment_type,attachment_size,reply_to_id,reply_snippet,reply_author,profiles!messages_user_id_fkey(username,avatar_url)&order=created_at.desc&limit=100', { token: session.access_token });
        if (cancelled) return;
        const ordered = (data || []).slice().reverse();
        setMessages(ordered);
        if (ordered.length) lastMsgTimeRef.current = ordered[ordered.length - 1].created_at;
        requestAnimationFrame(function () { scrollToBottom(true); });
      } catch (e) {
        setFatalError(e.message);
      }
    }
    async function pollNew() {
      if (!lastMsgTimeRef.current) return;
      try {
        const data = await sbFetch('/rest/v1/messages?channel_id=eq.' + currentChannelId + '&created_at=gt.' + encodeURIComponent(lastMsgTimeRef.current) + '&select=id,content,created_at,user_id,edited_at,attachment_url,attachment_name,attachment_type,attachment_size,reply_to_id,reply_snippet,reply_author,profiles!messages_user_id_fkey(username,avatar_url)&order=created_at.asc', { token: session.access_token });
        if (cancelled || !data || data.length === 0) return;
        maybeNotifyForMessages(data, profile.id, 'New message');
        setMessages(function (prev) {
          const existing = new Set(prev.map(function (m) { return m.id; }));
          const fresh = data.filter(function (m) { return !existing.has(m.id); });
          return fresh.length ? prev.concat(fresh) : prev;
        });
        lastMsgTimeRef.current = data[data.length - 1].created_at;
        requestAnimationFrame(function () { scrollToBottom(false); });
      } catch (e) { /* transient */ }
    }

    loadInitial();
    const interval = setInterval(pollNew, 2000);
    return function () { cancelled = true; clearInterval(interval); };
  }, [currentChannelId, session]);

  useEffect(function () {
    if (!session || !profile) return;
    let cancelled = false;
    async function beat() {
      try {
        await sbFetch('/rest/v1/profiles?id=eq.' + profile.id, { method: 'PATCH', token: session.access_token, body: { last_seen: new Date().toISOString() }, extraHeaders: { Prefer: 'return=minimal' } });
      } catch (e) { /* ignore */ }
    }
    beat();
    const interval = setInterval(function () { if (!cancelled) beat(); }, 20000);
    return function () { cancelled = true; clearInterval(interval); };
  }, [session, profile]);

  async function handleSend() {
    const content = messageInput.trim();
    if ((!content && !stagedFile) || !currentChannelId || !profile) return;
    setSending(true);
    setMessageInput('');
    const fileToSend = stagedFile;
    setStagedFile(null);
    setStagedPreviewUrl(null);
    const replySnapshot = replyingTo;
    setReplyingTo(null);
    try {
      const body = { channel_id: currentChannelId, user_id: profile.id, content: content || null };
      if (replySnapshot) {
        body.reply_to_id = replySnapshot.id;
        body.reply_snippet = (replySnapshot.content || 'Attachment').slice(0, 120);
        body.reply_author = replySnapshot.authorName;
      }
      if (fileToSend) {
        setUploading(true);
        const ext = (fileToSend.name.split('.').pop() || 'bin').toLowerCase();
        const path = currentChannelId + '/' + randomId() + '.' + ext;
        const url = await uploadToStorage('attachments', path, fileToSend, session.access_token);
        body.attachment_url = url;
        body.attachment_name = fileToSend.name;
        body.attachment_type = fileToSend.type || 'application/octet-stream';
        body.attachment_size = fileToSend.size;
        setUploading(false);
      }
      const created = await sbFetch('/rest/v1/messages', { method: 'POST', token: session.access_token, body: body, extraHeaders: { Prefer: 'return=representation' } });
      const row = created[0];
      const withProfile = Object.assign({}, row, { profiles: { username: profile.username, avatar_url: profile.avatar_url } });
      setMessages(function (prev) { return prev.some(function (m) { return m.id === withProfile.id; }) ? prev : prev.concat([withProfile]); });
      lastMsgTimeRef.current = withProfile.created_at;
      stickToBottomRef.current = true;
      requestAnimationFrame(function () { scrollToBottom(true); });
    } catch (e) {
      setMessageInput(content);
      setStagedFile(fileToSend);
      setFatalError(e.message);
    } finally {
      setSending(false);
      setUploading(false);
    }
  }

  async function handleEditMessage(messageId, newContent) {
    try {
      const updated = await sbFetch('/rest/v1/messages?id=eq.' + messageId, {
        method: 'PATCH', token: session.access_token,
        body: { content: newContent, edited_at: new Date().toISOString() },
        extraHeaders: { Prefer: 'return=representation' },
      });
      setMessages(function (prev) { return prev.map(function (m) { return m.id === messageId ? Object.assign({}, m, updated[0]) : m; }); });
    } catch (e) {
      setFatalError(e.message);
    }
  }

  async function handleDeleteMessage(messageId) {
    try {
      await sbFetch('/rest/v1/messages?id=eq.' + messageId, { method: 'DELETE', token: session.access_token, extraHeaders: { Prefer: 'return=minimal' } });
      setMessages(function (prev) { return prev.filter(function (m) { return m.id !== messageId; }); });
    } catch (e) {
      setFatalError(e.message);
    }
  }

  async function handleCreateServer(name, emoji, gameTag) {
    setModalBusy(true);
    try {
      const created = await sbFetch('/rest/v1/servers', { method: 'POST', token: session.access_token, body: { name: name, emoji: emoji, owner_id: profile.id, game_tag: gameTag || null }, extraHeaders: { Prefer: 'return=representation' } });
      const server = created[0];
      await sbFetch('/rest/v1/server_members', { method: 'POST', token: session.access_token, body: { server_id: server.id, user_id: profile.id }, extraHeaders: { Prefer: 'return=minimal' } });
      await sbFetch('/rest/v1/channels', { method: 'POST', token: session.access_token, body: { server_id: server.id, name: 'general', position: 0 }, extraHeaders: { Prefer: 'return=minimal' } });
      setShowAddServer(false);
      await loadServers();
      setCurrentServerId(server.id);
      setView('server');
    } catch (e) {
      setFatalError(e.message);
    } finally {
      setModalBusy(false);
    }
  }

  async function handleJoinServer(serverId) {
    setModalBusy(true);
    try {
      await sbFetch('/rest/v1/server_members', { method: 'POST', token: session.access_token, body: { server_id: serverId, user_id: profile.id }, extraHeaders: { Prefer: 'return=minimal' } });
      setShowAddServer(false);
      await loadServers();
      setCurrentServerId(serverId);
    } catch (e) {
      setFatalError(e.message);
    } finally {
      setModalBusy(false);
    }
  }

  async function handleSaveServerSettings(updates) {
    if (!currentServer) return;
    const patch = {};
    if (updates.iconFile) {
      const ext = (updates.iconFile.name.split('.').pop() || 'png').toLowerCase();
      const path = currentServer.id + '/icon-' + randomId() + '.' + ext;
      patch.icon_url = await uploadToStorage('server-icons', path, updates.iconFile, session.access_token);
    }
    if (updates.permission) patch.icon_permission = updates.permission;
    if (Object.keys(patch).length === 0) return;
    const updated = await sbFetch('/rest/v1/servers?id=eq.' + currentServer.id, {
      method: 'PATCH', token: session.access_token, body: patch,
      extraHeaders: { Prefer: 'return=representation' },
    });
    if (updated && updated[0]) {
      setServers(function (prev) { return prev.map(function (s) { return s.id === updated[0].id ? updated[0] : s; }); });
    }
  }

  async function handleChangeMemberRole(userId, role) {
    if (!currentServer) return;
    try {
      await sbFetch('/rest/v1/server_members?server_id=eq.' + currentServer.id + '&user_id=eq.' + userId, {
        method: 'PATCH', token: session.access_token, body: { role: role },
        extraHeaders: { Prefer: 'return=minimal' },
      });
      setMembers(function (prev) { return prev.map(function (m) { return m.user_id === userId ? Object.assign({}, m, { role: role }) : m; }); });
    } catch (e) {
      setFatalError(e.message);
    }
  }

  async function handleDeleteServer() {
    if (!currentServer) return;
    const ok = window.confirm('Delete "' + currentServer.name + '" for everyone? This cannot be undone.');
    if (!ok) return;
    try {
      await sbFetch('/rest/v1/servers?id=eq.' + currentServer.id, { method: 'DELETE', token: session.access_token, extraHeaders: { Prefer: 'return=minimal' } });
      setServers(function (prev) { return prev.filter(function (s) { return s.id !== currentServer.id; }); });
      setCurrentServerId(null);
      setView('home');
    } catch (e) {
      setFatalError(e.message);
    }
  }

  async function handleCreateChannel(name) {
    setModalBusy(true);
    try {
      const created = await sbFetch('/rest/v1/channels', { method: 'POST', token: session.access_token, body: { server_id: currentServerId, name: name, position: channels.length }, extraHeaders: { Prefer: 'return=representation' } });
      const channel = created[0];
      setChannels(function (prev) { return prev.some(function (c) { return c.id === channel.id; }) ? prev : prev.concat([channel]); });
      setCurrentChannelId(channel.id);
      setShowAddChannel(false);
    } catch (e) {
      setFatalError(e.message);
    } finally {
      setModalBusy(false);
    }
  }

  const currentServer = servers.find(function (s) { return s.id === currentServerId; }) || null;
  const currentChannel = channels.find(function (c) { return c.id === currentChannelId; }) || null;
  const currentDmThread = dmThreads.find(function (t) { return t.id === currentDmThreadId; }) || null;
  const dmOtherUser = currentDmThread ? (currentDmThread.user1_id === profile.id ? currentDmThread.user2 : currentDmThread.user1) : null;
  const normalizedDmMessages = profile ? dmMessages.map(function (m) {
    const isMine = m.sender_id === profile.id;
    return Object.assign({}, m, { user_id: m.sender_id, profiles: isMine ? { username: profile.username, avatar_url: profile.avatar_url } : dmOtherUser });
  }) : [];

  let content;
  if (booting) {
    content = <LoadingScreen />;
  } else if (!session || !profile) {
    if (showLanding) {
      content = <LandingPage onEnter={function (mode) { setAuthInitialMode(mode); setShowLanding(false); }} />;
    } else {
      content = (
        <AuthScreen
          initialMode={authInitialMode}
          onLogin={handleLogin}
          onSignup={handleSignup}
          onGoogleLogin={handleGoogleLogin}
          busy={authBusy}
          error={authError}
          pendingConfirmation={pendingConfirmation}
          onBackToLogin={function () { setPendingConfirmation(false); }}
        />
      );
    }
  } else if (needsUsername) {
    content = <ClaimUsernameScreen onSubmit={handleClaimUsername} />;
  } else {
    const isDmView = view === 'dm';
    let chatProps;
    if (isDmView) {
      if (!currentDmThreadId || !dmOtherUser) {
        chatProps = { emptyMode: true, emptyIcon: <IconAt size={40} />, emptyTitle: 'Direct Messages', emptyBody: 'Click someone in a member list to start a private conversation.' };
      } else {
        chatProps = {
          headerIcon: <Avatar username={dmOtherUser.username} avatarUrl={dmOtherUser.avatar_url} size={24} />,
          title: dmOtherUser.username,
          startTitle: 'This is the start of your conversation with ' + dmOtherUser.username,
          startBody: 'Messages here are private — only the two of you can see them.',
          placeholder: 'Message @' + dmOtherUser.username,
          messages: normalizedDmMessages,
          onSend: handleSendDm,
          onEditMessage: handleEditDmMessage,
          onDeleteMessage: handleDeleteDmMessage,
          isStarred: function (id) { return starredDmIds.has(id); },
          onToggleStar: function (id) { toggleStarMessage(id, true); },
          onForward: function (m) { setShowForwardFor({ message: m, isDm: true }); },
          onStartCall: dmOtherUser ? function (kind) { startCall(dmOtherUser.id, dmOtherUser.username, dmOtherUser.avatar_url, kind); } : null,
        };
      }
    } else {
      if (!currentServer) {
        chatProps = { emptyMode: true, emptyIcon: <IconMessage size={40} />, emptyTitle: 'Welcome to Kizora', emptyBody: 'Join or create a server to start chatting.' };
      } else if (!currentChannel) {
        chatProps = { emptyMode: true, emptyIcon: <IconHash size={40} />, emptyTitle: 'No channels yet', emptyBody: 'Add a channel to start the conversation.' };
      } else {
        chatProps = {
          headerIcon: <IconHash size={18} />,
          title: currentChannel.name,
          startTitle: 'Welcome to #' + currentChannel.name,
          startBody: 'This is the start of the channel. Say hi!',
          placeholder: 'Message #' + currentChannel.name,
          messages: messages,
          onSend: handleSend,
          onEditMessage: handleEditMessage,
          onDeleteMessage: handleDeleteMessage,
          onToggleMembers: function () { setMembersOpen(function (v) { return !v; }); },
          isStarred: function (id) { return starredMsgIds.has(id); },
          onToggleStar: function (id) { toggleStarMessage(id, false); },
          onForward: function (m) { setShowForwardFor({ message: m, isDm: false }); },
        };
      }
    }

    content = (
      <div className="app" data-bg={bgMode}>
        <BackgroundLayer mode={bgMode} customImage={customBgImage} />
        <MainNavRail onSelectTab={function (tab) {
          if (tab === 'chats') handleGoHome();
          else if (tab === 'calls') setShowCallHistory(true);
          else if (tab === 'status') setShowStatusFeed(true);
          else if (tab === 'channels') { if (currentServerId) setView('server'); else if (servers.filter(function (s) { return myServerIds.has(s.id); }).length) { setCurrentServerId(servers.filter(function (s) { return myServerIds.has(s.id); })[0].id); setView('server'); } else setShowAddServer(true); }
          else if (tab === 'communities') setShowAddServer(true);
          else if (tab === 'archive') setShowArchiveModal(true);
          else if (tab === 'media') setShowMediaGallery(true);
          else if (tab === 'menu') setShowMenuPanel(true);
        }} />
        <ServerRail servers={servers} myServerIds={myServerIds} currentServerId={currentServerId} view={view} onGoHome={handleGoHome} onSelect={function (id) { setCurrentServerId(id); setView('server'); }} onAddClick={function () { setShowAddServer(true); }} archivedServerIds={archivedServerIds} onArchiveServer={handleToggleArchiveServer} onOpenReels={function () { setShowReels(true); }} />
        {isDmView ? (
          <DmSidebar threads={dmThreads} myId={profile.id} currentThreadId={currentDmThreadId} onSelectThread={setCurrentDmThreadId} profile={profile} onLogout={handleLogout} onOpenSettings={function () { setShowSettings(true); }} myStatus={statusesByUser[profile.id]} onViewStatus={setViewingStatus} onAddStatus={function () { setShowStatusUpload(true); }} archivedDmIds={archivedDmIds} onToggleArchive={handleToggleArchiveDm} />
        ) : (
          <ChannelSidebar server={currentServer} channels={channels} currentChannelId={currentChannelId} onSelectChannel={setCurrentChannelId} onAddChannel={function () { setShowAddChannel(true); }} profile={profile} onLogout={handleLogout} onOpenSettings={function () { setShowSettings(true); }} myStatus={statusesByUser[profile.id]} onViewStatus={setViewingStatus} onAddStatus={function () { setShowStatusUpload(true); }} onDeleteServer={handleDeleteServer} onOpenServerSettings={function () { setShowServerSettings(true); }} />
        )}
        <ChatArea
          {...chatProps}
          density={density}
          statusesByUser={statusesByUser}
          onViewStatus={setViewingStatus}
          currentUserId={profile.id}
          messageInput={messageInput}
          setMessageInput={setMessageInput}
          sending={sending}
          listRef={listRef}
          onScroll={handleScroll}
          stagedFile={stagedFile}
          replyingTo={replyingTo}
          onReply={setReplyingTo}
          onCancelReply={function () { setReplyingTo(null); }}
          stagedPreviewUrl={stagedPreviewUrl}
          uploading={uploading}
          onStageFile={handleStageFile}
          onSendVoice={handleSendVoiceNote}
          onClearStagedFile={handleClearStagedFile}
        />
        {!isDmView && membersOpen && currentServer && <MemberSidebar members={members} myId={profile.id} ownerId={currentServer.owner_id} onStartDm={handleStartDm} statusesByUser={statusesByUser} onViewStatus={setViewingStatus} />}
        {showAddServer && (
          <AddServerModal onClose={function () { setShowAddServer(false); }} servers={servers} myServerIds={myServerIds} onCreate={handleCreateServer} onJoin={handleJoinServer} busy={modalBusy} />
        )}
        {showAddChannel && (
          <AddChannelModal onClose={function () { setShowAddChannel(false); }} onCreate={handleCreateChannel} busy={modalBusy} />
        )}
        {showSettings && (
          <SettingsModal
            profile={profile}
            onClose={function () { setShowSettings(false); }}
            onSaveProfile={handleSaveProfile}
            onUpdatePrivacy={handleUpdatePrivacy}
            theme={theme}
            accentPreset={accentPreset}
            density={density}
            onThemeChange={handleThemeChange}
            onAccentChange={handleAccentChange}
            onDensityChange={handleDensityChange}
            bgMode={bgMode}
            customBgImage={customBgImage}
            onBgModeChange={handleBgModeChange}
            onCustomBgUpload={handleCustomBgUpload}
          />
        )}
        {viewingStatus && <StatusViewerModal status={viewingStatus} onClose={function () { setViewingStatus(null); }} />}
        {showStatusUpload && <StatusUploadModal onClose={function () { setShowStatusUpload(false); }} onPost={handlePostStatus} />}
        {showForwardFor && (
          <ForwardModal
            channels={currentServer ? channels : []}
            serverName={currentServer ? currentServer.name : ''}
            dmThreads={dmThreads}
            myId={profile.id}
            onClose={function () { setShowForwardFor(null); }}
            onForward={function (target) { handleForwardMessage(showForwardFor.message, showForwardFor.isDm, target.kind === 'channel' ? { kind: 'channel', id: target.id } : { kind: 'dm', id: target.id }); }}
          />
        )}
        {showReels && (
          <ReelsView
            myId={profile.id}
            fetchReels={fetchReels}
            onUpload={handleUploadReel}
            onDelete={handleDeleteReel}
            onClose={function () { setShowReels(false); }}
          />
        )}
        {incomingCall && !activeCall && (
          <IncomingCallModal call={incomingCall} onAccept={acceptIncomingCall} onDecline={declineIncomingCall} />
        )}
        {activeCall && (
          <ActiveCallModal
            call={activeCall}
            localStream={localStream}
            remoteStream={remoteStream}
            micMuted={micMuted}
            camOff={camOff}
            onToggleMic={toggleMic}
            onToggleCam={toggleCam}
            onHangup={hangUpCall}
            onCancel={cancelOutgoingCall}
          />
        )}
        {showServerSettings && currentServer && (
          <ServerSettingsModal
            server={currentServer}
            myId={profile.id}
            members={members}
            canEditIcon={(function () {
              if (profile.id === currentServer.owner_id) return true;
              const perm = currentServer.icon_permission || 'admins';
              if (perm === 'owner') return false;
              if (perm === 'everyone') return true;
              const me = members.find(function (m) { return m.user_id === profile.id; });
              return !!(me && me.role === 'admin');
            })()}
            onSave={handleSaveServerSettings}
            onChangeRole={handleChangeMemberRole}
            onClose={function () { setShowServerSettings(false); }}
          />
        )}
        {showCallHistory && <CallHistoryModal myId={profile.id} fetchLogs={fetchCallLogs} onClose={function () { setShowCallHistory(false); }} />}
        {showStatusFeed && (
          <StatusFeedModal
            statusesByUser={statusesByUser}
            onViewStatus={function (s) { setShowStatusFeed(false); setViewingStatus(s); }}
            onAddStatus={function () { setShowStatusFeed(false); setShowStatusUpload(true); }}
            onClose={function () { setShowStatusFeed(false); }}
          />
        )}
        {showArchiveModal && (
          <ArchiveModal
            dmThreads={dmThreads}
            archivedDmIds={archivedDmIds}
            servers={servers}
            myServerIds={myServerIds}
            archivedServerIds={archivedServerIds}
            myId={profile.id}
            onUnarchiveDm={handleToggleArchiveDm}
            onUnarchiveServer={handleToggleArchiveServer}
            onClose={function () { setShowArchiveModal(false); }}
          />
        )}
        {showMediaGallery && <MediaGalleryModal fetchMedia={fetchMedia} onClose={function () { setShowMediaGallery(false); }} />}
        {showMenuPanel && (
          <MenuPanel
            profile={profile}
            onOpenSettings={function () { setShowSettings(true); }}
            onOpenReels={function () { setShowReels(true); }}
            onLogout={handleLogout}
            onClose={function () { setShowMenuPanel(false); }}
          />
        )}
        {fatalError && <div className="toast-error" onClick={function () { setFatalError(''); }}>{fatalError}</div>}
      </div>
    );
  }

  return <div className="view-fade-in">{content}</div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

  // Manually transform the JSX source above with the classic runtime
  // (React.createElement calls) rather than the automatic runtime, which
  // would inject an ES `import` statement that a plain <script> can't run.
  (function () {
    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'kizuna.jsx',
    }).code;
    var el = document.createElement('script');
    el.textContent = output;
    document.body.appendChild(el);
  })();
</script>
</body>
